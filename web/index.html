<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>necklace-to-bond</title>
    <style>
      body {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        background: #12141a;
        color: #e6e6e6;
        margin: 2rem auto;
        max-width: 40rem;
        padding: 0 1rem;
      }
      h1 {
        font-size: 1.2rem;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        padding: 0.4rem 0.6rem;
        text-align: right;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      thead th {
        border-bottom: 1px solid #3a3f4b;
        color: #9aa3b2;
      }
      tbody tr:hover {
        background: #1c2029;
      }
      #status {
        color: #e05561;
      }
    </style>
  </head>
  <body>
    <h1>necklace-to-bond</h1>
    <p id="status">loading…</p>
    <table id="out" hidden>
      <thead>
        <tr>
          <th>Product</th>
          <th>pSell</th>
          <th>i1Buy</th>
          <th>i1Sell</th>
          <th>i2Buy</th>
          <th>i2Sell</th>
          <th>Profit</th>
          <th>Bond</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <script>
      const url = "https://prices.runescape.wiki/api/v1/osrs/latest";
      const ids = {
        goldBar: 2357,
        diamondNecklace: 1662,
        diamond: 1601,
        bond: 13190,
      };

      function tax(price) {
        if (price < 50) return 0;
        return Math.min(Math.trunc((price * 2) / 100), 5_000_000);
      }

      async function main() {
        const status = document.getElementById("status");
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error("bad status " + res.status);
          const { data } = await res.json();
          const px = (id) => data[id];
          const necklace = px(ids.diamondNecklace);
          const bar = px(ids.goldBar);
          const gem = px(ids.diamond);
          const bond = px(ids.bond);
          const profit = necklace.high - gem.low - bar.low - tax(necklace.high);
          document.querySelector("#out tbody").innerHTML =
            `<tr><td>dia nklc</td><td>${necklace.high}</td>` +
            `<td>${bar.low}</td><td>${bar.high}</td>` +
            `<td>${gem.low}</td><td>${gem.high}</td>` +
            `<td>${profit}</td><td>${bond.low}</td></tr>`;
          document.getElementById("out").hidden = false;
          status.textContent = "";
        } catch (e) {
          status.textContent = "failed to load prices: " + e.message;
        }
      }
      main();
    </script>
  </body>
</html>
